
server {
    listen       80;
    listen       [::]:80;

    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Maintenance notice page: serve it for every path so any deep link
    # into the old app still shows the redirect notice instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If anything goes wrong, fall back to the same notice page rather
    # than a bare nginx error page.
    error_page 500 502 503 504 /index.html;
}
